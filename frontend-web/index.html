    <title>Vela - Personal Study Tracker & Learning Management System</title>

      "@context": "https://schema.org",

        "price": "0",

        "Task management with subtasks",
        "Note taking with folders and linking",
        "Goal tracking",
        "Attachments and file organization",
        "Progress analytics",
        "Android mobile app"
      ]
    }
