<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer ambient glow (wide, soft) -->
    <filter id="ambient" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
    </filter>
    <!-- Mid glow -->
    <filter id="mid-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Crisp inner core glow -->
    <filter id="core-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="#0F0F0F"/>

  <!-- Outer ambient glow layer -->
  <polyline
    points="235,240 512,790 789,240"
    fill="none"
    stroke="#F59E0B"
    stroke-width="22"
    stroke-linejoin="miter"
    filter="url(#ambient)"
    opacity="0.55"
  />

  <!-- Mid glow layer -->
  <polyline
    points="235,240 512,790 789,240"
    fill="none"
    stroke="#F59E0B"
    stroke-width="16"
    stroke-linejoin="miter"
    filter="url(#mid-glow)"
    opacity="0.75"
  />

  <!-- Crisp core stroke -->
  <polyline
    points="235,240 512,790 789,240"
    fill="none"
    stroke="#FCD34D"
    stroke-width="6"
    stroke-linejoin="miter"
    filter="url(#core-glow)"
  />
</svg>
