name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Setup Java for Android build
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Production APK
      env:
        VITE_API_URL: http://${{ secrets.EC2_HOST }}/vela/api
      run: |
        cd frontend-web
        echo "Installing dependencies..."
        npm install

        echo "Building mobile app with production API URL: $VITE_API_URL"
        echo "Verifying VITE_API_URL is set: $VITE_API_URL"
        npm run build:mobile

        echo "Syncing Capacitor..."
        npx cap sync android

        echo "Generating debug keystore if it doesn't exist..."
        mkdir -p ~/.android
        if [ ! -f ~/.android/debug.keystore ]; then
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

        echo "Building Android APK..."
        cd android
        chmod +x ./gradlew
        ./gradlew assembleRelease --no-daemon

        echo "Signing APK with debug keystore..."
        # Find the latest build-tools version
        BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
        echo "Using build-tools: $BUILD_TOOLS"

        # Align the APK
        $BUILD_TOOLS/zipalign -v -p 4 \
          app/build/outputs/apk/release/app-release-unsigned.apk \
          app/build/outputs/apk/release/app-release-aligned.apk

        # Sign the APK with debug keystore (for testing)
        # Note: For production, use a proper release keystore stored in GitHub secrets
        $BUILD_TOOLS/apksigner sign \
          --ks ~/.android/debug.keystore \
          --ks-key-alias androiddebugkey \
          --ks-pass pass:android \
          --key-pass pass:android \
          --out app/build/outputs/apk/release/app-release-signed.apk \
          app/build/outputs/apk/release/app-release-aligned.apk

        echo "Verifying APK signature..."
        $BUILD_TOOLS/apksigner verify app/build/outputs/apk/release/app-release-signed.apk

        echo "Copying signed APK to mobile directory..."
        # Create mobile directory in root (we are in frontend-web/android, so go up two levels)
        mkdir -p ../../mobile
        cp app/build/outputs/apk/release/app-release-signed.apk ../../mobile/app-release.apk

        echo "✅ Signed APK built successfully!"
        ls -lh ../../mobile/app-release.apk

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/study-tracker:latest

    - name: Unused - Install SSH Key (Just validation)
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.EC2_SSH_KEY }}
        name: id_rsa
        known_hosts: unnecessary
        if_key_exists: replace

    - name: Add Known Hosts
      run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to EC2
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ${{ secrets.EC2_USERNAME }}
        DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "${EC2_USER}@${EC2_HOST}" "
          echo '=== Stopping old container ==='
          docker stop study-tracker || true
          docker rm study-tracker || true
          
          echo '=== Removing old image ==='
          docker rmi ${DOCKER_USER}/study-tracker:latest || true
          
          echo '=== Pulling latest image ==='
          docker pull ${DOCKER_USER}/study-tracker:latest
          
          echo '=== Starting new container ==='
          docker run -d --name study-tracker -p 80:3000 \
            -e NODE_ENV='production' \
            -e DATABASE_URL='${DATABASE_URL}' \
            -e DB_SSM_PARAM_NAME='${{ secrets.DB_SSM_PARAM_NAME }}' \
            -e AWS_REGION='${{ secrets.AWS_REGION || 'us-east-1' }}' \
            --restart unless-stopped \
            ${DOCKER_USER}/study-tracker:latest
          
          echo '=== Verifying container is running ==='
          sleep 5
          docker ps | grep study-tracker
          
          echo '=== Checking logs ==='
          docker logs study-tracker --tail 20
        "
