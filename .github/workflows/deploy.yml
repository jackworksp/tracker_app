name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  # Job 1: Build Flutter APK + upload release + send email
  build-apk:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Java for Android build
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.0'
        channel: 'stable'
        cache: true

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-${{ runner.os }}-

    - name: Build Flutter APK
      run: |
        echo "Restoring release keystore from secret..."
        mkdir -p ~/.android
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/vela-release.keystore

        echo "Creating key.properties for Flutter signing..."
        cat > android/key.properties <<EOF
        storePassword=velaapp123
        keyPassword=velaapp123
        keyAlias=vela
        storeFile=${HOME}/.android/vela-release.keystore
        EOF

        echo "Installing Flutter dependencies..."
        flutter pub get

        echo "Building release APK..."
        flutter build apk --release

        echo "Copying APK to mobile directory..."
        mkdir -p mobile
        cp build/app/outputs/flutter-apk/app-release.apk mobile/app-release.apk

        echo "✅ Flutter APK built successfully!"
        ls -lh mobile/app-release.apk

    - name: Upload APK to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: "Vela Build #${{ github.run_number }}"
        body: |
          **Automated build** from commit `${{ github.sha }}`
          Branch: `${{ github.ref_name }}`

          Install this APK on your Android device to get the latest version.
          Existing installs will receive JS-level changes automatically via Capgo OTA.
        files: mobile/app-release.apk
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Send email notification
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.GMAIL_USERNAME }}
        password: ${{ secrets.GMAIL_PASSWORD }}
        to: ${{ secrets.GMAIL_USERNAME }}
        from: Vela CI <${{ secrets.GMAIL_USERNAME }}>
        subject: "Vela Build #${{ github.run_number }} ready"
        body: |
          New Vela APK is ready!

          Build: #${{ github.run_number }}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}

          Download APK:
          https://github.com/jackworksp/tracker_app/releases/tag/build-${{ github.run_number }}

  # Job 2: Run backend tests — catches API shape changes before deploy
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install backend dependencies
      run: cd backend && npm install

    - name: Run backend tests
      run: cd backend && npm test
      env:
        NODE_ENV: test
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}

  # Job 3: Build Docker image + deploy to EC2 (runs after tests pass)
  deploy-web:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/study-tracker:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Install SSH Key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.EC2_SSH_KEY }}
        name: id_rsa
        known_hosts: unnecessary
        if_key_exists: replace

    - name: Add Known Hosts
      run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to EC2
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ${{ secrets.EC2_USERNAME }}
        DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "${EC2_USER}@${EC2_HOST}" "
          echo '=== Stopping old container ==='
          docker stop study-tracker || true
          docker rm study-tracker || true

          echo '=== Aggressive Docker cleanup (free max space before pull) ==='
          docker system prune -a -f --volumes || true
          sudo journalctl --vacuum-size=50M || true

          echo '=== Disk space after cleanup ==='
          df -h

          echo '=== Pulling latest image ==='
          docker pull ${DOCKER_USER}/study-tracker:latest

          echo '=== Starting new container ==='
          docker run -d --name study-tracker -p 80:3000 \
            -e NODE_ENV='production' \
            -e DATABASE_URL='${DATABASE_URL}' \
            -e JWT_SECRET='${{ secrets.JWT_SECRET }}' \
            -e DB_SSM_PARAM_NAME='${{ secrets.DB_SSM_PARAM_NAME }}' \
            -e AWS_REGION='${{ secrets.AWS_REGION || 'us-east-1' }}' \
            -e GEMINI_API_KEY='${{ secrets.GEMINI_API_KEY }}' \
            -e CLICKUP_API_TOKEN='${{ secrets.CLICKUP_API_TOKEN }}' \
            --restart unless-stopped \
            ${DOCKER_USER}/study-tracker:latest

          echo '=== Verifying container is running ==='
          sleep 5
          docker ps | grep study-tracker

          echo '=== Checking logs ==='
          docker logs study-tracker --tail 20
        "
