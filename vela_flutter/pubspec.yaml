name: vela_flutter
description: Vela - Personal Learning Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  # Navigation
  go_router: ^14.0.0
  # Networking
  dio: ^5.4.0
  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  # UI
  flutter_lucide: ^1.1.1
  fl_chart: ^0.66.0
  flutter_animate: ^4.5.0
  flutter_slidable: ^3.0.1
  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.2
  image_picker: ^1.0.5
  file_picker: ^8.0.0
  local_auth: ^2.1.7
  flutter_local_notifications: ^17.0.0
  share_handler: ^0.0.20
  cached_network_image: ^3.3.0
  equatable: ^2.0.5
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  mocktail: ^1.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
