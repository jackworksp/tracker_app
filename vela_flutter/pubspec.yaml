name: vela_flutter
description: Vela - Personal Learning Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  # Navigation
  go_router: ^14.0.0
  # Networking
  dio: ^5.4.0
  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  # UI
  flutter_lucide: ^1.1.1
  fl_chart: ^0.66.0
  flutter_animate: ^4.5.0
  flutter_slidable: ^3.0.1
  webview_flutter: ^4.7.0
  youtube_player_flutter: ^9.1.1
  flutter_markdown: ^0.7.4
  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.2
  image_picker: ^1.0.5
  file_picker: ^8.0.0
  local_auth: ^2.1.7
  flutter_local_notifications: ^17.0.0
  share_handler: ^0.0.20
  cached_network_image: ^3.3.0
  equatable: ^2.0.5
  google_fonts: ^6.1.0
  package_info_plus: ^8.0.0
  open_file_plus: ^3.4.1
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  mocktail: ^1.0.1
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0F0F0F"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/
